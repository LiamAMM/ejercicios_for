<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla del 3</title>
    <link rel="stylesheet" href="multiplicar.css">
</head>

<body>

    <!-- Botón e Instrucciones en la parte superior -->
    <header class="header-top">
        <div class="instrucciones-box">
            <label for="txtTabla" class="lbl-instruccion">Escribe un número para calcular su tabla:</label>
            <div class="grupo-control">
                <input type="number" id="txtTabla" class="caja-texto" placeholder="Ej. 5, 7, 12..." min="1">
                <button class="btn-probar" onclick="generarTablas()">¡PROBAR! 🚀</button>
            </div>
            <span class="txt-ayuda">💡 Escribe cualquier número entero y presiona PROBAR.</span>
        </div>
    </header>

    <!-- Contenido principal: Tabla de Multiplicar -->
    <main class="contenedor" id="tabla">
        <h1>✨ Tabla de Multiplicar del 3 ✨</h1>

        <div class="tabla">
            <div class="fila">3 × 1 = 3</div>
            <div class="fila">3 × 2 = 6</div>
            <div class="fila">3 × 3 = 9</div>
            <div class="fila">3 × 4 = 12</div>
            <div class="fila">3 × 5 = 15</div>
            <div class="fila">3 × 6 = 18</div>
            <div class="fila">3 × 7 = 21</div>
            <div class="fila">3 × 8 = 24</div>
            <div class="fila">3 × 9 = 27</div>
            <div class="fila">3 × 10 = 30</div>
        </div>
    </main>

    <!-- Pie de página con crédito -->
    <footer class="footer">
        <p>Creado por: 🌟 <strong>Liam Morales</strong> 🌟</p>
    </footer>
    <script src="multiplicar.js"></script>
</body>

</html>
