<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla del 3</title>
    <link rel="stylesheet" href="multiplicar.css">
</head>

<body>

    <!-- Botón en la parte superior -->
    <header class="header-top">
        <button class="btn-probar">¡PROBAR! 🚀</button>
    </header>

    <!-- Contenido principal: Tabla del 3 -->
    <main class="container">
        <h1>✨ Tabla de Multiplicar del 3 ✨</h1>

        <div class="grid-tabla">
            <div class="card-item">3 × 1 = 3</div>
            <div class="card-item">3 × 2 = 6</div>
            <div class="card-item">3 × 3 = 9</div>
            <div class="card-item">3 × 4 = 12</div>
            <div class="card-item">3 × 5 = 15</div>
            <div class="card-item">3 × 6 = 18</div>
            <div class="card-item">3 × 7 = 21</div>
            <div class="card-item">3 × 8 = 24</div>
            <div class="card-item">3 × 9 = 27</div>
            <div class="card-item">3 × 10 = 30</div>
        </div>
    </main>

    <!-- Pie de página con crédito -->
    <footer class="footer">
        <p>Creado por: 🌟 <strong>este pechito</strong> 🌟</p>
    </footer>

</body>

</html>
